name: Release tag

# Tags main as vX.Y.Z when CMakeLists.txt lands with a project version of 1.0.0 or later that has
# no tag yet.
on:
  push:
    branches: [main]
    paths: [CMakeLists.txt]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create the tag if missing
        run: |
          version=$(sed -n 's/^project(wfmat VERSION \([0-9][0-9.]*\).*/\1/p' CMakeLists.txt | head -n1)
          if [ -z "$version" ]; then echo "no project version in CMakeLists.txt" >&2; exit 1; fi
          case "$version" in 0.*) echo "pre-release version $version: no tag"; exit 0 ;; esac
          tag="v$version"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "$tag already exists"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "wfmat $version" "$GITHUB_SHA"
          git push origin "$tag"
