<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 290" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <title>Bulge geometry</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#8a8a8a"/>
    </marker>
  </defs>
  <rect width="760" height="290" fill="#ffffff"/>
  <text x="24" y="28" font-size="15" font-weight="600" fill="#1f1f1f">The bulge b = tan(θ/4) bends the segment from one vertex to the next</text>
  <g stroke="#d9d9d9" stroke-width="1.25" fill="none">
    <line x1="320" y1="70" x2="200" y2="190"/>
    <line x1="320" y1="70" x2="440" y2="190"/>
    <path d="M298.8 91.2A30 30 0 0 0 341.2 91.2" stroke="#8a8a8a"/>
  </g>
  <line x1="200" y1="190" x2="436" y2="190" stroke="#8a8a8a" stroke-width="1.25" marker-end="url(#arrow)"/>
  <line x1="320" y1="190" x2="320" y2="239.7" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 3"/>
  <path d="M200 190A169.7 169.7 0 0 1 440 190" fill="none" stroke="#8a8a8a" stroke-width="1.25" stroke-dasharray="6 4"/>
  <path d="M200 190A169.7 169.7 0 0 0 440 190" fill="none" stroke="#2a78d6" stroke-width="2"/>
  <g fill="#1f1f1f">
    <circle cx="200" cy="190" r="3.5"/>
    <circle cx="440" cy="190" r="3.5"/>
    <circle cx="320" cy="70" r="3"/>
    <circle cx="320" cy="190" r="2.5"/>
  </g>
  <text x="456" y="146" font-size="11.5" fill="#5c5c5c">b &lt; 0: clockwise, bows left of travel</text>
  <text x="320" y="266" text-anchor="middle" fill="#1f1f1f">b &gt; 0: counter-clockwise, bows right of travel (here θ = 90°, b = 0.414)</text>
  <text x="190" y="194" text-anchor="end" fill="#1f1f1f">P₁ = [x, y, b]</text>
  <text x="452" y="204" fill="#1f1f1f">P₂ = next vertex</text>
  <text x="330" y="66" fill="#1f1f1f">centre</text>
  <text x="320" y="118" text-anchor="middle" fill="#1f1f1f">θ</text>
  <text x="252" y="126" text-anchor="end" fill="#5c5c5c">R</text>
  <text x="388" y="126" fill="#5c5c5c">R</text>
  <text x="312" y="182" text-anchor="end" font-size="11.5" fill="#5c5c5c">M</text>
  <text x="376" y="182" text-anchor="middle" font-size="11.5" fill="#5c5c5c">chord c</text>
  <text x="314" y="226" text-anchor="end" font-size="11.5" fill="#5c5c5c">s</text>
</svg>
